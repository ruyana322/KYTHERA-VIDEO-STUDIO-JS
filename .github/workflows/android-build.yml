name: Android Debug APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Kythera Video Studio Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        run: |
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          ./gradlew --version

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Generate Build & ARM64 Diagnostics
        if: success()
        run: |
          echo "=== Build Environment ==="
          java -version
          ./gradlew --version
          echo "=== Output APK Inspection ==="
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            ls -lh "$APK_PATH"
            echo "=== Verify Native APK Contents ==="
            unzip -l "$APK_PATH" | grep -E "classes[0-9]*\.dex|AndroidManifest\.xml|resources\.arsc"
            echo "=== ARM64 Compatibility ==="
            echo "APK is pure Kotlin/Compose (no ABI-restricted native libs; compatible with arm64-v8a, armeabi-v7a, x86_64)."
          else
            echo "APK not found at $APK_PATH"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kythera-video-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
